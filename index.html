<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resellers Shop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }
    header {
      background: #111;
      padding: 20px;
      text-align: center;
      font-size: 2em;
      color: #0f0;
    }
    .store {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      padding: 20px;
    }
    .item {
      background: #1a1a1a;
      padding: 16px;
      border-radius: 8px;
      width: 160px;
      text-align: center;
      cursor: pointer;
    }
    .item img {
      width: 100%;
      border-radius: 8px;
    }
    .cart-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #0f0;
      color: #000;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .cart {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      color: #fff;
      padding: 20px;
      box-sizing: border-box;
    }
    .cart-item {
      margin-bottom: 10px;
    }
    .confirm-btn, .back-btn {
      background: #0f0;
      color: #000;
      border: none;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <header>Resellers Shop</header>
  <button class="cart-btn" onclick="showCart()">Cart</button>
  <div class="store" id="store"></div>  <div class="cart" id="cart">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <button class="confirm-btn" onclick="confirmOrder()">Confirm Purchase</button>
    <button class="back-btn" onclick="hideCart()">Back to Shop</button>
  </div>  <script>
    const products = [
      { name: "Eric Emanuels", img: "eric-shorts.jpg", price: 40 },
      { name: "Bape Shorts", img: "bape-shorts.jpg", price: 45 },
      { name: "Essentials Shorts", img: "essentials-shorts.jpg", price: 35 },
      { name: "Sony XM5", img: "sony-xm5.jpg", price: 170 },
      { name: "Airpod Max", img: "airpod-max.jpg", price: 160 },
      { name: "Stanley Cup", img: "stanley-cup.jpg", price: 30 },
      { name: "Northface Puffer", img: "northface.jpg", price: 80 },
      { name: "Sp5der Hoodie", img: "sp5der-combo.jpg", price: 60 },
      { name: "Sp5der Sweatpants", img: "sp5der-combo.jpg", price: 55 },
      { name: "Airpod Pro 2", img: "airpodpro2.jpg", price: 55 },
      { name: "Airpod 4", img: "airpod4.jpg", price: 58 },
    ];

    const store = document.getElementById("store");
    const cart = document.getElementById("cart");
    const cartItems = document.getElementById("cartItems");
    let cartData = [];

    products.forEach((product, index) => {
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <img src="${product.img}" alt="${product.name}" />
        <h4>${product.name}</h4>
        <p>$${product.price}</p>
      `;
      div.onclick = () => addToCart(index);
      store.appendChild(div);
    });

    function addToCart(index) {
      const item = products[index];
      const entry = cartData.find(c => c.name === item.name);
      if (entry) {
        entry.qty += 1;
      } else {
        cartData.push({ name: item.name, price: item.price, qty: 1 });
      }
      alert(`${item.name} added to cart.`);
    }

    function showCart() {
      cartItems.innerHTML = cartData.map(item => `
        <div class="cart-item">
          ${item.name} x${item.qty} - $${item.qty * item.price}
        </div>
      `).join("");
      cart.style.display = "block";
    }

    function hideCart() {
      cart.style.display = "none";
    }

    function confirmOrder() {
      const total = cartData.reduce((sum, item) => sum + item.qty * item.price, 0);
      alert(`Send $${total} to $ManjorPayne on Cash App. Include nothing in the notes.`);
      cartData = [];
      hideCart();
    }
  </script></body>
</html>
