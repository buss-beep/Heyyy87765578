<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resellers Shop</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: black;
      color: white;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      font-size: 1.2rem;
      background: #111;
      position: sticky;
      top: 0;
    }
    .product-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }
    .product {
      background: #1a1a1a;
      padding: 1rem;
      border-radius: 12px;
      width: calc(33% - 2rem);
      min-width: 180px;
      text-align: center;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
    .product.visible {
      opacity: 1;
    }
    button, .bubble-btn {
      background: green;
      border: none;
      padding: 10px 20px;
      color: white;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 10px;
    }
    .cart-button {
      background: #222;
      color: #0f0;
      padding: 10px 20px;
      border-radius: 10px;
    }
    #cart-popup, #quantity-popup, #admin-login, #admin-panel {
      display: none;
      position: fixed;
      top: 10%;
      left: 10%;
      width: 80%;
      background: #111;
      padding: 1rem;
      border-radius: 12px;
      z-index: 10;
    }
    .out-of-stock {
      color: red;
      font-weight: bold;
    }
    .bubble-btn {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 16px;
      background: #333;
      color: white;
    }
    .bubble-btn.selected {
      background: #00f;
    }
  </style>
</head>
<body>
  <header>
    <div>Resellers Shop</div>
    <div>
      <button class="cart-button" onclick="openCart()">Cart</button>
      <button class="cart-button" onclick="openAdminLogin()">Admin</button>
    </div>
  </header>  <div class="product-grid" id="product-grid"></div>  <div id="quantity-popup"></div>  <div id="cart-popup"></div>  <div id="admin-login">
    <h3>Enter Admin Password</h3>
    <input type="password" id="admin-password" />
    <button onclick="checkAdmin()">Login</button>
  </div>  <div id="admin-panel">
    <h3>Order Log</h3>
    <ul id="order-log"></ul>
    <button onclick="closeAdmin()">Close</button>
  </div>  <script>
    const products = [
      { name: "Eric Emanuels", img: "eric-shorts.jpg", price: 40, stock: 10 },
      { name: "Bape Shorts", img: "bape-shorts.jpg", price: 40, stock: 10 },
      { name: "Essentials Shorts", img: "essentials-shorts.jpg", price: 35, stock: 10 },
      { name: "Sony XM5", img: "sony-xm5.jpg", price: 150, stock: 5 },
      { name: "Airpod Max", img: "airpod-max.jpg", price: 130, stock: 5 },
      { name: "Stanley Cup", img: "stanley-cup.jpg", price: 30, stock: 8 },
      { name: "Northface Puffer", img: "northface.jpg", price: 90, stock: 4 },
      { name: "Sp5der Combo", img: "sp5der-combo.jpg", price: 120, stock: 6 },
      { name: "Airpod Pro 2", img: "airpodpro2.jpg", price: 55, stock: 10 },
      { name: "Airpod 4", img: "airpod4.jpg", price: 60, stock: 10 }
    ];

    const cart = [];

    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";
      products.forEach((p, i) => {
        const item = document.createElement("div");
        item.className = "product visible";
        const stock = p.stock > 0 ? `<button onclick="openQuantity(${i})">Add to Cart</button>` : `<div class='out-of-stock'>OUT OF STOCK</div>`;
        item.innerHTML = `
          <img src="${p.img}" alt="${p.name}" />
          <div>${p.name}</div>
          <div>$${p.price}</div>
          ${stock}
        `;
        grid.appendChild(item);
      });
    }

    function openQuantity(index) {
      const p = products[index];
      const popup = document.getElementById("quantity-popup");
      popup.style.display = "block";
      popup.innerHTML = `
        <h3>${p.name}</h3>
        <p>Inventory Stock: ${p.stock}</p>
        <input type="number" id="qty" value="1" min="1" max="${p.stock}" oninput="checkQty(${index})" />
        <div id="qty-msg"></div>
        <button onclick="addToCart(${index})">Put in Cart</button>
        <button onclick="popup.style.display='none'">Back</button>
      `;
    }

    function checkQty(index) {
      const input = document.getElementById("qty");
      const msg = document.getElementById("qty-msg");
      if (parseInt(input.value) > products[index].stock) {
        msg.innerHTML = "<span style='color:red'>Too many!</span>";
      } else {
        msg.innerHTML = "";
      }
    }

    function addToCart(index) {
      const qty = parseInt(document.getElementById("qty").value);
      if (qty <= products[index].stock) {
        cart.push({ ...products[index], qty });
        document.getElementById("quantity-popup").style.display = "none";
        alert("Added to cart!");
      }
    }

    function openCart() {
      const popup = document.getElementById("cart-popup");
      popup.style.display = "block";
      let html = "<h3>Cart</h3><ul>";
      let total = 0;
      cart.forEach(item => {
        html += `<li>${item.name} x${item.qty} = $${item.qty * item.price}</li>`;
        total += item.qty * item.price;
      });
      html += `</ul><p>Total: $${total}</p>`;
      html += `<p>Send $${total} to CashTag: $ManjorPayne</p>`;
      html += `<input placeholder='Your CashTag'/><button class='bubble-btn' onclick='confirmOrder()'>Confirm Purchase</button><button class='bubble-btn' onclick='closeCart()'>Back</button>`;
      popup.innerHTML = html;
    }

    function closeCart() {
      document.getElementById("cart-popup").style.display = "none";
    }

    function confirmOrder() {
      const tag = document.querySelector("#cart-popup input").value;
      const summary = cart.map(i => `${i.name} x${i.qty}`).join(", ");
      const entry = document.createElement("li");
      entry.textContent = `@${tag} ordered: ${summary}`;
      document.getElementById("order-log").appendChild(entry);
      alert("Order noted!");
      cart.length = 0;
      closeCart();
    }

    function openAdminLogin() {
      document.getElementById("admin-login").style.display = "block";
    }

    function checkAdmin() {
      const pw = document.getElementById("admin-password").value;
      if (pw === "admin123") {
        document.getElementById("admin-login").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
      } else {
        alert("Wrong password!");
      }
    }

    function closeAdmin() {
      document.getElementById("admin-panel").style.display = "none";
    }

    renderProducts();
  </script></body>
</html>
