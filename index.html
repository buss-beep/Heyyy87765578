<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resellers Shop</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }
    .product {
      width: 30%;
      background: #1e1e1e;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      opacity: 0.5;
      transition: opacity 0.5s;
    }
    .product.in-view {
      opacity: 1;
    }
    .product img {
      width: 100%;
      border-radius: 8px;
    }
    .product h3 {
      margin: 0.5rem 0;
    }
    .product button {
      margin-top: 0.5rem;
      background: #00ff00;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .product button:disabled {
      background: none;
      color: red;
      border: 1px solid red;
      cursor: not-allowed;
    }
    #cart {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: #1e1e1e;
      padding: 1rem;
      border-radius: 12px;
      max-width: 300px;
      display: none;
    }
    #cart.show {
      display: block;
    }
    .cart-btn {
      background: #00ff00;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    .big-button {
      background: #00ff00;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 12px;
      border: none;
      width: 100%;
      font-size: 1.2rem;
    }
    @media(max-width: 768px) {
      .product {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>Resellers Shop</div>
    <button class="cart-btn" onclick="toggleCart()">Cart</button>
  </header>
  <div class="products" id="productList"></div>  <div id="cart">
    <h3>Your Cart</h3>
    <ul id="cartItems"></ul>
    <p id="totalPrice"></p>
    <button class="big-button" onclick="confirmOrder()">Confirm Purchase</button>
  </div>  <script>
    const inventory = {
      'eric-shorts.jpg': { name: 'Eric Emanuels', price: 28, stock: 10 },
      'bape-shorts.jpg': { name: 'Bape Shorts', price: 30, stock: 8 },
      'essentials-shorts.jpg': { name: 'Essentials Shorts', price: 26, stock: 12 },
      'sony-xm5.jpg': { name: 'Sony XM5', price: 170, stock: 5 },
      'airpod-max.jpg': { name: 'Airpod Max', price: 160, stock: 6 },
      'stanley-cup.jpg': { name: 'Stanley Cup', price: 24, stock: 20 },
      'northface.jpg': { name: 'Northface Puffer', price: 60, stock: 4 },
      'sp5der-combo.jpg': { name: 'Sp5der Hoodie', price: 50, stock: 5 },
      'sp5der-combo2.jpg': { name: 'Sp5der Sweatpants', price: 40, stock: 5 },
      'airpodpro2.jpg': { name: 'Airpod Pro 2', price: 55, stock: 10 },
      'airpod4.jpg': { name: 'Airpod Gen 4', price: 56, stock: 10 }
    };

    const cart = [];

    function renderProducts() {
      const container = document.getElementById('productList');
      container.innerHTML = '';
      Object.entries(inventory).forEach(([img, { name, price, stock }]) => {
        const div = document.createElement('div');
        div.className = 'product';
        const outOfStock = stock <= 0;
        div.innerHTML = `
          <img src="${img}" alt="${name}" />
          <h3>${name}</h3>
          <p>$${price}</p>
          <button ${outOfStock ? 'disabled' : ''} onclick="addToCart('${img}')">
            ${outOfStock ? 'OUT OF STOCK' : 'Add to Cart'}
          </button>
        `;
        container.appendChild(div);
      });
    }

    function addToCart(img) {
      const item = inventory[img];
      if (item.stock > 0) {
        cart.push(item);
        item.stock--;
        renderProducts();
        renderCart();
      }
    }

    function toggleCart() {
      document.getElementById('cart').classList.toggle('show');
      renderCart();
    }

    function renderCart() {
      const ul = document.getElementById('cartItems');
      ul.innerHTML = '';
      let total = 0;
      cart.forEach((item, i) => {
        const li = document.createElement('li');
        li.innerText = `${item.name} - $${item.price}`;
        ul.appendChild(li);
        total += item.price;
      });
      document.getElementById('totalPrice').innerText = `Total: $${total}`;
    }

    function confirmOrder() {
      alert('Send payment to $ManjorPayne on Cash App with your order note.');
    }

    function fadeInOnScroll() {
      const elements = document.querySelectorAll('.product');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in-view');
          }
        });
      });
      elements.forEach(el => observer.observe(el));
    }

    renderProducts();
    fadeInOnScroll();
  </script></body>
</html>
